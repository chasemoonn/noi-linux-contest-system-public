name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r orchestrator/requirements.txt

      - name: Check Python and run unit tests
        working-directory: orchestrator
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Check and test Hydro plugin
        working-directory: hydro-plugin-orchestrator
        run: |
          node --check index.js
          node --test tests/*.test.js

      - name: Check deployment scripts
        run: bash -n deploy/*.sh scripts/*.sh

      - name: Check reproducible demo assets
        run: python scripts/build_demo.py --check

      - name: Check public release boundary
        run: python scripts/check_public_release.py
